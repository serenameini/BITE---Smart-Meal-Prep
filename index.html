<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BITE - Smart Meal Prep</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #334155;
      --primary: #10b981;
      --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --accent: #f59e0b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #475569;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header UI */
    header {
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(90deg, #34d399, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .subtitle { font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }

    /* Bottom Navigation Bar */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    nav button {
      flex: 1;
      padding: 12px 4px;
      border: none;
      background: none;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--subtext);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav button.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }

    /* Layout & Cards */
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .btn-main {
      width: 100%;
      padding: 16px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .day-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .day-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meal-box {
      margin-bottom: 12px;
      padding: 12px;
      background: var(--card-inner);
      border-radius: 12px;
    }
    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .meal-label { font-size: 0.7rem; font-weight: 800; color: var(--subtext); text-transform: uppercase; }
    .meal-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
    
    .meal-meta {
      display: flex;
      gap: 10px;
      font-size: 0.75rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .badge-salva {
      background: #78350f;
      color: #fef3c7;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #f59e0b;
    }

    /* Actions UI */
    .swap-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .swap-search {
      display: flex;
      gap: 6px;
    }
    .swap-search input {
      flex: 1;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      font-size: 0.8rem;
    }
    .btn-action {
      padding: 8px 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-salva-action {
      width: 100%;
      padding: 8px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    /* Checklist Item */
    .list-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .list-item input { margin-right: 12px; transform: scale(1.3); }
    .list-item.checked { text-decoration: line-through; opacity: 0.4; }

    /* Switch Colazione */
    .breakfast-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .batch-card {
      background: var(--card-bg);
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .batch-card h4 { color: var(--primary); margin-bottom: 4px; font-size: 0.95rem; }
    .batch-card p { font-size: 0.8rem; color: var(--subtext); }
  </style>
</head>
<body>

  <header>
    <div class="logo">BITE</div>
    <div class="subtitle">Smart Meal Prep</div>
  </header>

  <div class="container">
    
    <!-- TAB MENU -->
    <div id="tab-menu" class="tab-content active">
      <button class="btn-main" onclick="generaMenuSettimanale()">⚡ Rigenera Settimana</button>

      <div class="breakfast-toggle">
        <span>Includi Colazione</span>
        <input type="checkbox" id="include-breakfast" onchange="toggleColazione(this.checked)">
      </div>

      <div id="menu-container"></div>
    </div>

    <!-- TAB SPESA -->
    <div id="tab-spesa" class="tab-content">
      <h2 style="margin-bottom: 8px;">🛒 Lista Spesa</h2>
      <p style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 16px;">Generata in automatico dalle ricette della settimana.</p>
      <div id="spesa-container"></div>
    </div>

    <!-- TAB BATCH COOKING -->
    <div id="tab-batch" class="tab-content">
      <h2 style="margin-bottom: 8px;">👩‍🍳 Prep & Batch</h2>
      <p style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 16px;">Cose che puoi cuocere in anticipo Domenica/Lunedì:</p>
      <div id="batch-container"></div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <nav>
    <button id="nav-menu" class="active" onclick="switchTab('menu')">
      <span>📅</span> Menu
    </button>
    <button id="nav-spesa" onclick="switchTab('spesa')">
      <span>🛒</span> Spesa
    </button>
    <button id="nav-batch" onclick="switchTab('batch')">
      <span>👩‍🍳</span> Prep
    </button>
  </nav>

  <script>
    // Database Ricette con tempi e modalità di cottura
    const ricetteDB = {
      primi_secondi: [
        { id: 1, nome: "Pasta al Pomodoro e Basilico", ingredienti: ["Pasta", "Passata di pomodoro", "Aglio", "Basilico"], tempo: "15 min", metodo: "🍳 Padella", prep: "Cuoci un vaso grande di sugo al pomodoro." },
        { id: 2, nome: "Riso con Zucchine e Zafferano", ingredienti: ["Riso", "Zucchine", "Zafferano", "Cipolla"], tempo: "20 min", metodo: "🍳 Padella", prep: "Lessa il riso e salta le zucchine in anticipo." },
        { id: 3, nome: "Pollo Grigliato & Insalata", ingredienti: ["Petto di pollo", "Lattuga", "Limoni"], tempo: "10 min", metodo: "🍳 Padella", prep: "Puoi marinare il pollo la sera prima." },
        { id: 4, nome: "Salmone al Forno con Patate", ingredienti: ["Filetto di salmone", "Patate", "Rosmarino"], tempo: "25 min", metodo: "♨️ Forno / Air Fryer", prep: "Taglia le patate a cubetti pronte per la cottura." },
        { id: 5, nome: "Frittata alle Erbe & Zucchine", ingredienti: ["Uova", "Prezzemolo", "Zucchine", "Formaggio"], tempo: "12 min", metodo: "🍳 Padella", prep: "Lava e affetta le zucchine." },
        { id: 6, nome: "Pasta con i Broccoli", ingredienti: ["Pasta", "Broccoli", "Aglio", "Peperoncino"], tempo: "15 min", metodo: "🍳 Padella", prep: "Lessa i broccoli a vapore in anticipo." },
        { id: 7, nome: "Insalatona con Tonno e Uova", ingredienti: ["Lattuga", "Tonno in scatola", "Uova", "Pomodori"], tempo: "10 min", metodo: "🥗 Senza Cottura", prep: "Rassoda le uova (durano 4-5 giorni in frigo)." },
        { id: 8, nome: "Vellutata Zucca e Carote", ingredienti: ["Zucca", "Carote", "Cipolla", "Olio EVO"], tempo: "30 min", metodo: "🍳 Padella", prep: "Prepara l'intera vellutata e conservala in frigo." },
        { id: 9, nome: "Lenticchie in Umido e Crostini", ingredienti: ["Lenticchie", "Passata di pomodoro", "Pane"], tempo: "20 min", metodo: "🍳 Padella", prep: "Cuoci le lenticchie (più buone se riscaldate)." },
        { id: 10, nome: "Ceci Speziati & Spinaci", ingredienti: ["Ceci", "Paprika", "Aglio", "Spinaci"], tempo: "10 min", metodo: "🍳 Padella", prep: "Sciacqua i ceci pronti all'uso." }
      ],
      salvaimprevisti: [
        { id: 101, nome: "Pizza Surgelata", ingredienti: ["Pizza surgelata"], tempo: "12 min", metodo: "♨️ Forno / Air Fryer", prep: null },
        { id: 102, nome: "Ravioli Pronti Burro & Salvia", ingredienti: ["Ravioli freschi", "Burro", "Salvia"], tempo: "5 min", metodo: "🍳 Padella", prep: null },
        { id: 103, nome: "Zuppa Pronta in Busta", ingredienti: ["Zuppa pronta"], tempo: "4 min", metodo: "🍳 Padella", prep: null },
        { id: 104, nome: "Bastoncini di Pesce & Patatine", ingredienti: ["Bastoncini di pesce", "Patate surgelate"], tempo: "15 min", metodo: "♨️ Forno / Air Fryer", prep: null }
      ],
      colazioni: [
        { id: 201, nome: "Yogurt, Muesli & Miele", ingredienti: ["Yogurt", "Muesli", "Miele"], tempo: "2 min", metodo: "🥗 Senza Cottura", prep: null },
        { id: 202, nome: "Fette Biscottate e Marmellata", ingredienti: ["Caffè", "Fette biscottate", "Marmellata"], tempo: "3 min", metodo: "🥗 Senza Cottura", prep: null },
        { id: 203, nome: "Pancake Veloci & Frutta", ingredienti: ["Farina", "Latte", "Uova", "Frutta"], tempo: "10 min", metodo: "🍳 Padella", prep: "Pastella pronta la sera prima." }
      ]
    };

    const giorni = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
    let menuCorrente = [];
    let includiColazione = false;

    function generaMenuSettimanale() {
      menuCorrente = [];
      
      let salvaimprevistiSlots = new Set();
      while(salvaimprevistiSlots.size < 2) {
        let slotRnd = Math.floor(Math.random() * 14);
        salvaimprevistiSlots.add(slotRnd);
      }

      let mealIndex = 0;

      giorni.forEach((giorno) => {
        let giornoObj = { giorno, pranzo: null, cena: null, colazione: null };

        if (includiColazione) {
          giornoObj.colazione = getRandom(ricetteDB.colazioni);
        }

        // Pranzo
        if (salvaimprevistiSlots.has(mealIndex)) {
          giornoObj.pranzo = { ...getRandom(ricetteDB.salvaimprevisti), salvaimprevisti: true };
        } else {
          giornoObj.pranzo = getRandom(ricetteDB.primi_secondi);
        }
        mealIndex++;

        // Cena (Diversa dal pranzo dello stesso giorno)
        let cenaScelta;
        let tentativi = 0;
        do {
          if (salvaimprevistiSlots.has(mealIndex)) {
            cenaScelta = { ...getRandom(ricetteDB.salvaimprevisti), salvaimprevisti: true };
          } else {
            cenaScelta = getRandom(ricetteDB.primi_secondi);
          }
          tentativi++;
        } while (cenaScelta.id === giornoObj.pranzo.id && tentativi < 20);

        giornoObj.cena = cenaScelta;
        mealIndex++;

        menuCorrente.push(giornoObj);
      });

      renderMenu();
      aggiornaSpesa();
      aggiornaBatchCooking();
    }

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function renderMenu() {
      const container = document.getElementById("menu-container");
      container.innerHTML = "";

      menuCorrente.forEach((g, dayIdx) => {
        let html = `<div class="day-card"><div class="day-title">${g.giorno}</div>`;

        if (g.colazione) {
          html += `
            <div class="meal-box">
              <div class="meal-header"><span class="meal-label">Colazione</span></div>
              <div class="meal-title">${g.colazione.nome}</div>
              <div class="meal-meta"><span>⏱️ ${g.colazione.tempo}</span><span>${g.colazione.metodo}</span></div>
            </div>`;
        }

        html += renderMealBox(g.pranzo, dayIdx, 'pranzo');
        html += renderMealBox(g.cena, dayIdx, 'cena');

        html += `</div>`;
        container.innerHTML += html;
      });
    }

    function renderMealBox(pasto, dayIdx, tipoPasto) {
      let isSalva = pasto.salvaimprevisti ? `<span class="badge-salva">⚡ SALVAIMPREVISTI</span>` : '';
      return `
        <div class="meal-box">
          <div class="meal-header">
            <span class="meal-label">${tipoPasto.toUpperCase()}</span>
            ${isSalva}
          </div>
          <div class="meal-title">${pasto.nome}</div>
          <div class="meal-meta">
            <span>⏱️ ${pasto.tempo}</span>
            <span>${pasto.metodo}</span>
          </div>
          <div class="swap-container">
            <div class="swap-search">
              <input type="text" id="input-${dayIdx}-${tipoPasto}" placeholder="Filtra per ingrediente...">
              <button class="btn-action" onclick="cambiaPerIngrediente(${dayIdx}, '${tipoPasto}')">Cerca</button>
            </div>
            <button class="btn-salva-action" onclick="impostaSalvaImprevisti(${dayIdx}, '${tipoPasto}')">⚡ Metti Salvaimprevisti</button>
          </div>
        </div>`;
    }

    function cambiaPerIngrediente(dayIdx, tipoPasto) {
      const inputEl = document.getElementById(`input-${dayIdx}-${tipoPasto}`);
      const ingredienteCercato = inputEl.value.trim().toLowerCase();

      let piscina = [...ricetteDB.primi_secondi, ...ricetteDB.salvaimprevisti];
      let opzioni = piscina.filter(r => r.ingredienti.some(i => i.toLowerCase().includes(ingredienteCercato)));

      let altroPasto = (tipoPasto === 'pranzo') ? menuCorrente[dayIdx].cena : menuCorrente[dayIdx].pranzo;
      opzioni = opzioni.filter(r => r.id !== altroPasto.id);

      if (opzioni.length > 0) {
        menuCorrente[dayIdx][tipoPasto] = getRandom(opzioni);
      } else {
        alert(`Nessuna alternativa con "${ingredienteCercato}" trovata.`);
      }

      renderMenu();
      aggiornaSpesa();
      aggiornaBatchCooking();
    }

    function impostaSalvaImprevisti(dayIdx, tipoPasto) {
      let opzioneSalva = { ...getRandom(ricetteDB.salvaimprevisti), salvaimprevisti: true };
      menuCorrente[dayIdx][tipoPasto] = opzioneSalva;

      renderMenu();
      aggiornaSpesa();
      aggiornaBatchCooking();
    }

    function aggiornaSpesa() {
      const spesaContainer = document.getElementById("spesa-container");
      let ingredientiSet = new Set();

      menuCorrente.forEach(g => {
        if (g.colazione) g.colazione.ingredienti.forEach(i => ingredientiSet.add(i));
        if (g.pranzo) g.pranzo.ingredienti.forEach(i => ingredientiSet.add(i));
        if (g.cena) g.cena.ingredienti.forEach(i => ingredientiSet.add(i));
      });

      spesaContainer.innerHTML = "";
      Array.from(ingredientiSet).sort().forEach((ing, idx) => {
        spesaContainer.innerHTML += `
          <div class="list-item" onclick="this.classList.toggle('checked')">
            <input type="checkbox" id="spesa-${idx}">
            <label for="spesa-${idx}">${ing}</label>
          </div>`;
      });
    }

    function aggiornaBatchCooking() {
      const batchContainer = document.getElementById("batch-container");
      batchContainer.innerHTML = "";

      let preparazioni = new Map();

      menuCorrente.forEach(g => {
        [g.colazione, g.pranzo, g.cena].forEach(pasto => {
          if (pasto && pasto.prep) {
            preparazioni.set(pasto.nome, pasto.prep);
          }
        });
      });

      if (preparazioni.size === 0) {
        batchContainer.innerHTML = "<p style='color:var(--subtext)'>Nessun prep richiesto per le ricette scelte.</p>";
        return;
      }

      preparazioni.forEach((prepInfo, nomeRicetta) => {
        batchContainer.innerHTML += `
          <div class="batch-card">
            <h4>${nomeRicetta}</h4>
            <p>${prepInfo}</p>
          </div>`;
      });
    }

    function toggleColazione(val) {
      includiColazione = val;
      generaMenuSettimanale();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`nav-${tab}`).classList.add('active');
    }

    generaMenuSettimanale();
  </script>
</body>
</html>
