<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricerca Ricette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <!-- Box di Ricerca (senza il pulsante Ricetta) -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Es. banana, porridge, cookies...">
      <button id="search-btn">🔍 Cerca</button>
    </div>

    <!-- Elenco dei Risultati -->
    <div id="results-container" class="results-container">
      <div class="recipe-item">
        <span class="recipe-name" data-id="1">Porridge di Avena e Banana</span>
      </div>
      <div class="recipe-item">
        <span class="recipe-name" data-id="2">Biscotti ai Chocolate Chips</span>
      </div>
    </div>
  </div>

  <!-- Popup Modal Ricetta -->
  <div id="recipe-modal" class="modal-overlay">
    <div class="modal-card">
      <span id="close-modal-btn" class="close-btn">&times;</span>
      <h2 id="modal-recipe-title">Titolo Ricetta</h2>
      <hr>
      <div id="modal-recipe-body">
        <!-- Il testo o gli ingredienti verranno inseriti via JavaScript -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
